# Coolify: New Resource > Docker Compose (Empty), paste this file, then set the
# environment variables RENDEZVOUS_SERVER, RS_PUB_KEY, RS_PRIV_KEY (and optionally APP_NAME).
# Generate the key pair with: python3 custom-client/server/gen-keys.py
services:
  rustdesk:
    image: rustdesk/rustdesk-server-s6:latest
    restart: unless-stopped
    environment:
      - RELAY=${RENDEZVOUS_SERVER}:21117
      - ENCRYPTED_ONLY=1
      - KEY_PUB=${RS_PUB_KEY}
      - KEY_PRIV=${RS_PRIV_KEY}
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21117:21117"
      - "21118:21118"
      - "21119:21119"
    volumes:
      - rustdesk-data:/data
  download:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_DOWNLOAD_80
      - APP_NAME=${APP_NAME:-AmberDesk}
      - GITHUB_REPO=${GITHUB_REPO:-viniloppes/rustdesk}
      - RENDEZVOUS_SERVER=${RENDEZVOUS_SERVER}
      - RS_PUB_KEY=${RS_PUB_KEY}
    entrypoint: ["/bin/sh", "-c", "wget -qO /setup.sh ${SETUP_URL:-https://raw.githubusercontent.com/viniloppes/rustdesk/master/custom-client/coolify/download.sh} && exec sh /setup.sh"]
volumes:
  rustdesk-data:
